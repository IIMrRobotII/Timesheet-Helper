name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run compile

      - name: Test
        run: bun run test:run

      - name: Build
        run: bun run build

      - name: Manifest/CSP guard
        run: bun run check:manifest

      - name: Zip
        run: bun run zip

      - name: Inspect zip payload
        run: |
          zip=$(ls .output/*-chrome.zip | head -n1)
          echo "Inspecting $zip"
          entries=$(unzip -Z1 "$zip")
          echo "$entries"
          forbidden=$(printf '%s\n' "$entries" | grep -E -i \
            '(^|/)(\.git|node_modules|\.env|_bmad|\.claude|\.codex|\.serena|\.agents)|(^|/)docs/|\.test\.|\.spec\.|\.map$|\.ts$' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::Forbidden entries found in zip payload:"
            printf '%s\n' "$forbidden"
            exit 1
          fi
          echo "Zip payload OK"
